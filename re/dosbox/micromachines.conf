# DOSBox-X reference configuration for Micro Machines ground-truth capture.
# Fixed cycles and native OPL2 rate keep traces reproducible.
#
# This file documents the settings; nothing reads it. tools/dbg_drive.py writes its own config and
# chdirs to the work directory before launching, so set the mount below to wherever your own
# installed copy of the game lives.
[sdl]
output=opengl
autolock=true

[dosbox]
machine=vgaonly
memsize=16
captures=../../build/capture

[cpu]
core=normal
cycles=fixed 3000

[render]
aspect=false
scaler=none

[mixer]
rate=49716

[sblaster]
sbtype=none
oplmode=opl2
oplemu=nuked
oplrate=49716

[speaker]
pcspeaker=true

[autoexec]
mount c /path/to/your/installed/game
c:
