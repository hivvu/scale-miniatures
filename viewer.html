<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Micro Machines asset viewer</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; padding: 16px; background: #14161a; color: #ddd; }
  h1 { font-size: 18px; } h2 { font-size: 14px; margin: 18px 0 6px; color: #9bd; }
  button { margin: 2px; padding: 6px 10px; background: #2a2f3a; color: #eee; border: 1px solid #445; border-radius: 4px; cursor: pointer; }
  canvas { display: block; image-rendering: pixelated; background: #000; max-width: 100%; }
  section { overflow-x: auto; }
</style>
</head>
<body>
<h1>Micro Machines asset viewer</h1>
<p>In development the viewer loads <code>./MicroMac</code> automatically through the Vite dev server. Otherwise pick the <b>MicroMac</b> folder (the one containing MICRO.EXE and GAME1/); files are read locally and never uploaded.</p>
<button id="pick">Choose MicroMac folder…</button>
<input id="fallback" type="file" webkitdirectory multiple hidden>
<span id="status"></span>
<div id="rounds" hidden></div>
<div id="out"></div>
<script type="module" src="/src/app/assetViewer/main.ts"></script>
</body>
</html>
